<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛小動物碼表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', 'Microsoft JhengHei', sans-serif;
            background-color: #fff5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .glass-card {
            background: white;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.3);
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            text-align: center;
            border: 8px solid #ffe4e9;
        }

        .timer-display {
            font-size: 4rem;
            font-weight: 700;
            color: #ff8fa3;
            margin: 1.5rem 0;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffe4e9;
            font-variant-numeric: tabular-nums;
        }

        .btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 20px;
            font-weight: 700;
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 0px #e0e0e0;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px transparent;
        }

        .btn-start { background-color: #b2f2bb; color: #2b8a3e; box-shadow: 0 4px 0px #8ce99a; }
        .btn-pause { background-color: #ffec99; color: #e67700; box-shadow: 0 4px 0px #ffd43b; }
        .btn-lap { background-color: #d0ebff; color: #1971c2; box-shadow: 0 4px 0px #a5d8ff; }
        .btn-reset { background-color: #ffc9c9; color: #c92a2a; box-shadow: 0 4px 0px #ffa8a8; }

        .lap-container {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 15px;
            background: #fffafa;
            padding: 10px;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: white;
            border-radius: 12px;
            border: 2px solid #ffe4e9;
            color: #ff8fa3;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 滾動條樣式 */
        .lap-container::-webkit-scrollbar {
            width: 6px;
        }
        .lap-container::-webkit-scrollbar-thumb {
            background: #ffc9c9;
            border-radius: 10px;
        }

        .decor-circle {
            position: absolute;
            z-index: -1;
            border-radius: 50%;
            background: #ffe4e9;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- 裝飾背景 -->
    <div class="decor-circle" style="width: 200px; height: 200px; top: 10%; left: -50px;"></div>
    <div class="decor-circle" style="width: 150px; height: 150px; bottom: 10%; right: -30px; background: #e3fafc;"></div>

    <div class="glass-card">
        <h1 class="text-2xl font-bold text-gray-600 mb-2">My Stopwatch</h1>
        <p class="text-sm text-gray-400 mb-6">⏱ 每一秒都值得被記住</p>

        <div class="timer-display" id="display">00:00.00</div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <button id="startPauseBtn" class="btn btn-start w-full text-lg">
                <span id="startPauseIcon">▶</span> <span id="startPauseText">開始</span>
            </button>
            <button id="lapBtn" class="btn btn-lap w-full text-lg" disabled style="opacity: 0.5; cursor: not-allowed;">
                <span>🏁</span> 分圈
            </button>
            <button id="resetBtn" class="btn btn-reset w-full text-lg">
                <span>🔄</span> 重置
            </button>
        </div>

        <div class="lap-container" id="laps">
            <!-- 分圈紀錄會出現在這裡 -->
            <div class="text-gray-300 text-sm mt-4 italic">尚無分圈紀錄</div>
        </div>
    </div>

    <script>
        let startTime;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;
        let lapCount = 0;

        const display = document.getElementById('display');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const startPauseText = document.getElementById('startPauseText');
        const startPauseIcon = document.getElementById('startPauseIcon');
        const lapBtn = document.getElementById('lapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapsContainer = document.getElementById('laps');

        function timeToString(time) {
            let diffInHrs = time / 3600000;
            let hh = Math.floor(diffInHrs);

            let diffInMin = (diffInHrs - hh) * 60;
            let mm = Math.floor(diffInMin);

            let diffInSec = (diffInMin - mm) * 60;
            let ss = Math.floor(diffInSec);

            let diffInMs = (diffInSec - ss) * 100;
            let ms = Math.floor(diffInMs);

            let formattedMM = mm.toString().padStart(2, "0");
            let formattedSS = ss.toString().padStart(2, "0");
            let formattedMS = ms.toString().padStart(2, "0");

            return `${formattedMM}:${formattedSS}.${formattedMS}`;
        }

        function print(txt) {
            display.innerHTML = txt;
        }

        function start() {
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(function printTime() {
                elapsedTime = Date.now() - startTime;
                print(timeToString(elapsedTime));
            }, 10);
            showButton("PAUSE");
            isRunning = true;
            lapBtn.disabled = false;
            lapBtn.style.opacity = "1";
            lapBtn.style.cursor = "pointer";
        }

        function pause() {
            clearInterval(timerInterval);
            showButton("START");
            isRunning = false;
        }

        function reset() {
            clearInterval(timerInterval);
            print("00:00.00");
            elapsedTime = 0;
            lapCount = 0;
            showButton("START");
            isRunning = false;
            lapsContainer.innerHTML = '<div class="text-gray-300 text-sm mt-4 italic">尚無分圈紀錄</div>';
            lapBtn.disabled = true;
            lapBtn.style.opacity = "0.5";
            lapBtn.style.cursor = "not-allowed";
        }

        function lap() {
            if (!isRunning) return;
            lapCount++;
            if (lapCount === 1) lapsContainer.innerHTML = '';
            
            const lapTime = timeToString(elapsedTime);
            const lapElement = document.createElement('div');
            lapElement.className = 'lap-item';
            lapElement.innerHTML = `
                <span>圈數 ${lapCount}</span>
                <span>${lapTime}</span>
            `;
            lapsContainer.prepend(lapElement);
        }

        function showButton(buttonKey) {
            if (buttonKey === "PAUSE") {
                startPauseBtn.className = "btn btn-pause w-full text-lg";
                startPauseText.innerText = "暫停";
                startPauseIcon.innerText = "⏸";
            } else {
                startPauseBtn.className = "btn btn-start w-full text-lg";
                startPauseText.innerText = elapsedTime > 0 ? "繼續" : "開始";
                startPauseIcon.innerText = "▶";
            }
        }

        // 事件監聽
        startPauseBtn.addEventListener("click", () => {
            if (!isRunning) {
                start();
            } else {
                pause();
            }
        });

        resetBtn.addEventListener("click", reset);
        lapBtn.addEventListener("click", lap);

    </script>
</body>
</html>
