<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代化精準碼錶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap');
        
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .timer-display {
            font-family: 'JetBrains+Mono', monospace;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .btn-glow:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-card rounded-3xl p-8 w-full max-w-md text-center">
        <h1 class="text-2xl font-bold mb-8 text-slate-400 tracking-widest uppercase">精準碼錶</h1>
        
        <!-- 計時顯示區域 -->
        <div class="timer-display text-6xl md:text-7xl font-medium mb-10 text-sky-400">
            <span id="minutes">00</span>:<span id="seconds">00</span><span class="text-3xl text-sky-600">.<span id="milliseconds">00</span></span>
        </div>

        <!-- 按鈕控制區 -->
        <div class="flex justify-center gap-4">
            <!-- 開始按鈕 -->
            <button id="startBtn" class="btn-glow flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 px-6 rounded-2xl transition-all duration-200 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                開始
            </button>

            <!-- 暫停按鈕 (初始隱藏) -->
            <button id="pauseBtn" class="btn-glow hidden flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 px-6 rounded-2xl transition-all duration-200 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                暫停
            </button>

            <!-- 重置按鈕 -->
            <button id="resetBtn" class="btn-glow flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 px-6 rounded-2xl transition-all duration-200 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                重置
            </button>
        </div>

        <!-- 狀態裝飾 -->
        <div class="mt-8">
            <div id="statusIndicator" class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800 text-xs font-semibold text-slate-500 transition-colors duration-300">
                <span class="w-2 h-2 rounded-full bg-slate-600" id="statusDot"></span>
                <span id="statusText">已停止</span>
            </div>
        </div>
    </div>

    <script>
        // 初始化變數
        let startTime;
        let elapsedTime = 0;
        let timerInterval;

        const minutesDisplay = document.getElementById('minutes');
        const secondsDisplay = document.getElementById('seconds');
        const millisecondsDisplay = document.getElementById('milliseconds');
        
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        const statusIndicator = document.getElementById('statusIndicator');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // 格式化時間函數
        function timeToString(time) {
            let diffInMin = time / (1000 * 60);
            let mm = Math.floor(diffInMin);

            let diffInSec = (diffInMin - mm) * 60;
            let ss = Math.floor(diffInSec);

            let diffInMs = (diffInSec - ss) * 100;
            let ms = Math.floor(diffInMs);

            let formattedMM = mm.toString().padStart(2, "0");
            let formattedSS = ss.toString().padStart(2, "0");
            let formattedMS = ms.toString().padStart(2, "0");

            return { mm: formattedMM, ss: formattedSS, ms: formattedMS };
        }

        // 更新顯示
        function print(time) {
            const formatted = timeToString(time);
            minutesDisplay.innerHTML = formatted.mm;
            secondsDisplay.innerHTML = formatted.ss;
            millisecondsDisplay.innerHTML = formatted.ms;
        }

        // 開始計時
        function start() {
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(function printTime() {
                elapsedTime = Date.now() - startTime;
                print(elapsedTime);
            }, 10);
            
            showButton("PAUSE");
            updateStatus("RUNNING");
        }

        // 暫停計時
        function pause() {
            clearInterval(timerInterval);
            showButton("START");
            updateStatus("PAUSED");
        }

        // 重置計時
        function reset() {
            clearInterval(timerInterval);
            print(0);
            elapsedTime = 0;
            showButton("START");
            updateStatus("STOPPED");
        }

        // 控制按鈕顯示切換
        function showButton(buttonKey) {
            if (buttonKey === "PAUSE") {
                startBtn.classList.add("hidden");
                pauseBtn.classList.remove("hidden");
            } else {
                startBtn.classList.remove("hidden");
                pauseBtn.classList.add("hidden");
            }
        }

        // 更新狀態燈
        function updateStatus(state) {
            switch(state) {
                case "RUNNING":
                    statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                    statusText.innerText = "計時中";
                    statusText.className = "text-emerald-500";
                    break;
                case "PAUSED":
                    statusDot.className = "w-2 h-2 rounded-full bg-amber-500";
                    statusText.innerText = "已暫停";
                    statusText.className = "text-amber-500";
                    break;
                case "STOPPED":
                    statusDot.className = "w-2 h-2 rounded-full bg-slate-600";
                    statusText.innerText = "已停止";
                    statusText.className = "text-slate-500";
                    break;
            }
        }

        // 事件監聽
        startBtn.addEventListener("click", start);
        pauseBtn.addEventListener("click", pause);
        resetBtn.addEventListener("click", reset);
    </script>
</body>
</html>
