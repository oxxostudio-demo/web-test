<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>即時相機取色器 - Real-time Color Picker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons for modern icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#3b82f6',
          },
          backdropBlur: {
            xs: '2px',
          }
        }
      }
    }
  </script>
  <style>
    /* 隱藏原生捲軸但保持滾動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 準星脈衝動畫 */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .reticle-pulse {
      animation: pulse-ring 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans select-none overflow-y-auto overflow-x-hidden touch-manipulation">

  <!-- 頂部導航列 -->
  <header class="sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-zinc-950/80 backdrop-blur-md border-b border-white/5">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
        <i class="ph-bold ph-eyedropper text-white text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide text-white leading-tight">CamColor 取色器</h1>
        <p class="text-[10px] text-zinc-400">正方形相機取景</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <!-- 切換鏡頭按鈕 -->
      <button id="flip-camera-btn" class="p-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-white/10 active:scale-95 transition-all text-white shadow" title="切換鏡頭">
        <i class="ph-bold ph-camera-rotate text-lg"></i>
      </button>
      <!-- 畫面凍結按鈕 -->
      <button id="freeze-btn" class="p-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-white/10 active:scale-95 transition-all text-white shadow" title="鎖定/暫停取色">
        <i id="freeze-icon" class="ph-bold ph-pause text-lg"></i>
      </button>
    </div>
  </header>

  <!-- 主內容區：置中正方形相機與控制面板 -->
  <main class="flex-1 w-full max-w-md mx-auto px-4 py-4 flex flex-col gap-4">

    <!-- 正方形相機預覽區 (Aspect Ratio 1:1) -->
    <div class="relative w-full aspect-square rounded-3xl overflow-hidden bg-zinc-900 border-2 border-white/10 shadow-2xl flex items-center justify-center">
      <!-- 視訊畫面 (利用 object-cover 填滿正方形) -->
      <video id="webcam" playsinline autoplay muted class="w-full h-full object-cover"></video>
      
      <!-- 離屏取樣 Canvas (隱藏) -->
      <canvas id="sampler-canvas" class="hidden"></canvas>

      <!-- 正方形中心準星 (Crosshair & Reticle) -->
      <div id="crosshair-wrapper" class="absolute inset-0 pointer-events-none flex items-center justify-center z-10">
        <div class="relative flex items-center justify-center">
          <!-- 外圈光暈 -->
          <div id="reticle-glow" class="w-16 h-16 rounded-full border border-white/40 reticle-pulse transition-colors duration-200"></div>
          <!-- 取樣環 -->
          <div class="absolute w-12 h-12 rounded-full border-2 border-white shadow-lg flex items-center justify-center bg-black/20 backdrop-blur-[1px]">
            <!-- 即時色彩圓點 preview -->
            <div id="center-color-dot" class="w-6 h-6 rounded-full border border-white/90 shadow-inner transition-colors duration-100"></div>
          </div>
          <!-- 十字準星輔助線 -->
          <div class="absolute w-5 h-[2px] bg-white/80 -left-6 rounded-full"></div>
          <div class="absolute w-5 h-[2px] bg-white/80 -right-6 rounded-full"></div>
          <div class="absolute h-5 w-[2px] bg-white/80 -top-6 rounded-full"></div>
          <div class="absolute h-5 w-[2px] bg-white/80 -bottom-6 rounded-full"></div>
        </div>
      </div>

      <!-- 凍結提示徽章 -->
      <div id="frozen-badge" class="hidden absolute top-4 left-1/2 -translate-x-1/2 px-3 py-1 bg-amber-500 text-black text-xs font-bold rounded-full shadow-lg flex items-center gap-1.5 z-20">
        <i class="ph-bold ph-lock-key"></i> 畫面已凍結取色
      </div>

      <!-- 相機未啟動/權限遮罩提示 -->
      <div id="camera-overlay" class="absolute inset-0 z-30 bg-zinc-950 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-16 h-16 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-blue-400 mb-4 shadow-xl">
          <i class="ph ph-camera text-3xl"></i>
        </div>
        <h2 class="text-base font-bold text-white mb-1.5">需要相機鏡頭權限</h2>
        <p class="text-zinc-400 text-xs max-w-xs mb-5 leading-relaxed">
          點擊下方按鈕以啟動相機。鏡頭將以 1:1 正方形取景，對準物體中心即可取得色碼。
        </p>
        <button id="start-camera-btn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white rounded-xl text-sm font-semibold shadow-lg shadow-blue-600/30 transition-all flex items-center gap-2">
          <i class="ph-bold ph-power text-base"></i>
          <span>開啟相機鏡頭</span>
        </button>
        <p id="error-message" class="text-red-400 text-xs mt-3 hidden max-w-xs"></p>
      </div>
    </div>

    <!-- 即時顏色與色碼面板 -->
    <div class="space-y-3.5 bg-zinc-900/60 border border-white/5 rounded-2xl p-4">
      
      <!-- 主預覽列與顏色名稱 -->
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div id="preview-color-box" class="w-12 h-12 rounded-xl border border-white/20 shadow-md transition-colors duration-100 flex-shrink-0"></div>
          <div>
            <div id="color-name" class="text-sm font-semibold text-white tracking-wide">偵測色彩中...</div>
            <div class="text-xs text-zinc-400">點擊下方色碼即可複製</div>
          </div>
        </div>

        <!-- 儲存色票按鈕 -->
        <button id="save-swatch-btn" class="px-3.5 py-2 bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-white text-xs font-semibold rounded-xl border border-white/10 flex items-center gap-1.5 transition-all shadow-sm">
          <i class="ph-bold ph-plus"></i>
          <span>儲存色票</span>
        </button>
      </div>

      <!-- 數值卡片 (HEX, RGB, HSL) -->
      <div class="grid grid-cols-3 gap-2">
        <!-- HEX -->
        <button onclick="copyToClipboard(currentHex, 'HEX 色碼')" class="group relative flex flex-col items-center justify-center p-2.5 rounded-xl bg-zinc-800/60 hover:bg-zinc-800 border border-white/5 active:scale-95 transition-all text-left">
          <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">HEX</span>
          <span id="hex-val" class="font-mono text-xs md:text-sm font-semibold text-white group-hover:text-blue-400 transition-colors">#------</span>
        </button>
        <!-- RGB -->
        <button onclick="copyToClipboard(currentRgb, 'RGB 色碼')" class="group relative flex flex-col items-center justify-center p-2.5 rounded-xl bg-zinc-800/60 hover:bg-zinc-800 border border-white/5 active:scale-95 transition-all text-left">
          <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">RGB</span>
          <span id="rgb-val" class="font-mono text-xs md:text-sm font-semibold text-white group-hover:text-blue-400 transition-colors">---</span>
        </button>
        <!-- HSL -->
        <button onclick="copyToClipboard(currentHsl, 'HSL 色碼')" class="group relative flex flex-col items-center justify-center p-2.5 rounded-xl bg-zinc-800/60 hover:bg-zinc-800 border border-white/5 active:scale-95 transition-all text-left">
          <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">HSL</span>
          <span id="hsl-val" class="font-mono text-xs md:text-sm font-semibold text-white group-hover:text-blue-400 transition-colors">---</span>
        </button>
      </div>

      <!-- 已儲存色票清單 (Palette Tray) -->
      <div class="pt-2 border-t border-white/5">
        <div class="flex items-center justify-between text-xs text-zinc-400 mb-2">
          <span class="flex items-center gap-1 font-medium">
            <i class="ph ph-swatches"></i> 已儲存色票 (<span id="swatch-count">0</span>)
          </span>
          <button id="clear-swatches-btn" class="hover:text-red-400 transition-colors text-[11px] underline hidden">清除全部</button>
        </div>
        
        <div id="swatch-container" class="flex gap-2 overflow-x-auto no-scrollbar py-1 min-h-[42px] items-center">
          <span id="empty-palette-tip" class="text-xs text-zinc-500 italic">尚未儲存任何顏色</span>
        </div>
      </div>
    </div>
  </main>

  <!-- 提示 Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-zinc-800 text-white border border-white/10 px-4 py-2 rounded-xl text-xs font-medium shadow-2xl flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none translate-y-3">
    <i class="ph-bold ph-check text-green-400"></i>
    <span id="toast-text">已複製到剪貼簿</span>
  </div>

  <script>
    // 狀態變數
    let currentStream = null;
    let facingMode = 'environment'; // 預設後置鏡頭
    let isFrozen = false;
    let animFrameId = null;

    let currentHex = '#000000';
    let currentRgb = 'rgb(0, 0, 0)';
    let currentHsl = 'hsl(0, 0%, 0%)';
    let savedPalettes = [];

    // DOM 元素快取
    const video = document.getElementById('webcam');
    const samplerCanvas = document.getElementById('sampler-canvas');
    const samplerCtx = samplerCanvas.getContext('2d', { willReadFrequently: true });
    const centerDot = document.getElementById('center-color-dot');
    const previewBox = document.getElementById('preview-color-box');
    const reticleGlow = document.getElementById('reticle-glow');
    const hexVal = document.getElementById('hex-val');
    const rgbVal = document.getElementById('rgb-val');
    const hslVal = document.getElementById('hsl-val');
    const colorNameEl = document.getElementById('color-name');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    const cameraOverlay = document.getElementById('camera-overlay');
    const startCameraBtn = document.getElementById('start-camera-btn');
    const errorMsg = document.getElementById('error-message');
    const flipBtn = document.getElementById('flip-camera-btn');
    const freezeBtn = document.getElementById('freeze-btn');
    const freezeIcon = document.getElementById('freeze-icon');
    const frozenBadge = document.getElementById('frozen-badge');
    const saveSwatchBtn = document.getElementById('save-swatch-btn');
    const swatchContainer = document.getElementById('swatch-container');
    const swatchCount = document.getElementById('swatch-count');
    const clearSwatchesBtn = document.getElementById('clear-swatches-btn');
    const emptyPaletteTip = document.getElementById('empty-palette-tip');

    // 啟動相機
    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      
      errorMsg.classList.add('hidden');
      const constraints = {
        video: {
          facingMode: facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();
        cameraOverlay.classList.add('hidden');
        if (!animFrameId) {
          processFrame();
        }
      } catch (err) {
        console.error("相機存取失敗: ", err);
        cameraOverlay.classList.remove('hidden');
        errorMsg.textContent = "無法啟動相機，請檢查瀏覽器權限或確認是否處於 HTTPS 環境。";
        errorMsg.classList.remove('hidden');
      }
    }

    // 擷取中心像素色彩（5x5 像素平均降噪）
    function sampleCenterColor() {
      if (video.videoWidth === 0 || video.videoHeight === 0) return;

      const vW = video.videoWidth;
      const vH = video.videoHeight;
      samplerCanvas.width = vW;
      samplerCanvas.height = vH;

      // 繪製視訊幀至 Canvas
      samplerCtx.drawImage(video, 0, 0, vW, vH);

      const centerX = Math.floor(vW / 2);
      const centerY = Math.floor(vH / 2);

      // 取中心周圍 5x5 範圍進行色彩平均降噪
      const sampleRadius = 2; // 5x5
      const startX = Math.max(0, centerX - sampleRadius);
      const startY = Math.max(0, centerY - sampleRadius);
      const size = sampleRadius * 2 + 1;

      try {
        const frameData = samplerCtx.getImageData(startX, startY, size, size).data;
        let rSum = 0, gSum = 0, bSum = 0, count = 0;

        for (let i = 0; i < frameData.length; i += 4) {
          rSum += frameData[i];
          gSum += frameData[i + 1];
          bSum += frameData[i + 2];
          count++;
        }

        const r = Math.round(rSum / count);
        const g = Math.round(gSum / count);
        const b = Math.round(bSum / count);

        updateColorUI(r, g, b);
      } catch (e) {
        // 避免 cross-origin 限制拋錯
      }
    }

    // 更新介面色彩與色彩模型轉換
    function updateColorUI(r, g, b) {
      currentHex = rgbToHex(r, g, b);
      currentRgb = `rgb(${r}, ${g}, ${b})`;
      const [h, s, l] = rgbToHsl(r, g, b);
      currentHsl = `hsl(${h}, ${s}%, ${l}%)`;
      const detectedName = getColorName(h, s, l, r, g, b);

      // 更新準星與指示卡片
      centerDot.style.backgroundColor = currentHex;
      previewBox.style.backgroundColor = currentHex;
      reticleGlow.style.borderColor = currentHex;
      reticleGlow.style.boxShadow = `0 0 15px ${currentHex}55`;

      hexVal.textContent = currentHex;
      rgbVal.textContent = `${r}, ${g}, ${b}`;
      hslVal.textContent = `${h}°, ${s}%, ${l}%`;
      colorNameEl.textContent = detectedName;
    }

    // 動態畫面迴圈
    function processFrame() {
      if (!isFrozen) {
        sampleCenterColor();
      }
      animFrameId = requestAnimationFrame(processFrame);
    }

    // 色彩格式轉換函式庫
    function componentToHex(c) {
      const hex = c.toString(16);
      return hex.length === 1 ? "0" + hex : hex;
    }

    function rgbToHex(r, g, b) {
      return "#" + (componentToHex(r) + componentToHex(g) + componentToHex(b)).toUpperCase();
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;

      if (max === min) {
        h = s = 0; // achromatic
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
    }

    // 簡易自然色彩名稱判別器
    function getColorName(h, s, l, r, g, b) {
      if (l <= 12) return '墨黑色 (Black)';
      if (l >= 92 && s <= 15) return '純白色 (White)';
      if (s <= 12) {
        if (l < 40) return '深灰色 (Dark Gray)';
        if (l < 70) return '中灰色 (Gray)';
        return '淺灰色 (Light Gray)';
      }

      if (h >= 345 || h < 15) return '鮮紅色 (Red)';
      if (h >= 15 && h < 45) {
        return (l < 45 && s < 60) ? '棕褐色 (Brown)' : '暖橙色 (Orange)';
      }
      if (h >= 45 && h < 70) return '明黃色 (Yellow)';
      if (h >= 70 && h < 165) {
        return (l < 30) ? '深森林綠 (Dark Green)' : '翠綠色 (Green)';
      }
      if (h >= 165 && h < 200) return '青綠 / 青碧色 (Cyan/Teal)';
      if (h >= 200 && h < 255) {
        return (l < 35) ? '海軍藍 (Navy Blue)' : '天藍 / 湛藍 (Blue)';
      }
      if (h >= 255 && h < 290) return '紫羅蘭色 (Violet)';
      if (h >= 290 && h < 345) return '洋紅 / 品粉色 (Magenta/Pink)';

      return '自訂色彩 (Custom)';
    }

    // 複製文字功能 (相容 iframe 與安全策略)
    function copyToClipboard(text, label = '色碼') {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(`已複製 ${label}: ${text}`);
      } catch (err) {
        showToast(`複製失敗，請手動複製`);
      }
      document.body.removeChild(textarea);
    }

    // 顯示 Toast 訊息
    let toastTimeout;
    function showToast(message) {
      toastText.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
      }, 2000);
    }

    // 儲存色票至清單
    function addColorSwatch(hex) {
      if (savedPalettes.includes(hex)) {
        showToast(`${hex} 已在色票庫中`);
        return;
      }
      savedPalettes.unshift(hex);
      renderSwatches();
      showToast(`已儲存色票: ${hex}`);
    }

    // 渲染色票列
    function renderSwatches() {
      swatchCount.textContent = savedPalettes.length;
      if (savedPalettes.length === 0) {
        emptyPaletteTip.classList.remove('hidden');
        clearSwatchesBtn.classList.add('hidden');
        swatchContainer.innerHTML = '';
        swatchContainer.appendChild(emptyPaletteTip);
        return;
      }

      emptyPaletteTip.classList.add('hidden');
      clearSwatchesBtn.classList.remove('hidden');
      swatchContainer.innerHTML = '';

      savedPalettes.forEach((hex, idx) => {
        const item = document.createElement('div');
        item.className = 'group relative flex-shrink-0 cursor-pointer animate-fade-in';
        item.innerHTML = `
          <div class="w-8 h-8 rounded-lg border border-white/20 shadow transition-transform active:scale-90" style="background-color: ${hex};" title="點擊複製 ${hex}"></div>
          <button class="absolute -top-1 -right-1 w-4 h-4 bg-zinc-900 border border-white/20 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-[10px]" title="刪除">
            <i class="ph-bold ph-x"></i>
          </button>
        `;

        // 點擊色塊複製
        item.querySelector('div').addEventListener('click', () => {
          copyToClipboard(hex, '色票');
        });

        // 點擊刪除按鈕
        item.querySelector('button').addEventListener('click', (e) => {
          e.stopPropagation();
          savedPalettes.splice(idx, 1);
          renderSwatches();
        });

        swatchContainer.appendChild(item);
      });
    }

    // 註冊事件監聽
    startCameraBtn.addEventListener('click', initCamera);

    // 切換前後鏡頭
    flipBtn.addEventListener('click', () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      initCamera();
      showToast(`已切換為${facingMode === 'environment' ? '後置(環境)' : '前置'}鏡頭`);
    });

    // 凍結/解凍色彩採樣
    freezeBtn.addEventListener('click', () => {
      isFrozen = !isFrozen;
      if (isFrozen) {
        video.pause();
        freezeIcon.className = 'ph-bold ph-play text-lg';
        freezeBtn.classList.add('bg-amber-600', 'hover:bg-amber-500');
        frozenBadge.classList.remove('hidden');
      } else {
        video.play();
        freezeIcon.className = 'ph-bold ph-pause text-lg';
        freezeBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500');
        frozenBadge.classList.add('hidden');
      }
    });

    // 儲存當前色票
    saveSwatchBtn.addEventListener('click', () => {
      addColorSwatch(currentHex);
    });

    // 清空色票
    clearSwatchesBtn.addEventListener('click', () => {
      savedPalettes = [];
      renderSwatches();
    });

    // 視窗載入完成後嘗試自動開啟相機
    window.addEventListener('load', () => {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        initCamera();
      } else {
        cameraOverlay.classList.remove('hidden');
        errorMsg.textContent = "您的瀏覽器不支援相機 API，或未在安全連線 (HTTPS) 下運行。";
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
